<head>

<title>SAA 鉄板パターン単語帳</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-2: #e8ecf1;
    --line: #d3d9e1;
    --ink: #1a222d;
    --ink-2: #4a5462;
    --ink-3: #7b8695;
    --accent: #e0850f;
    --accent-ink: #9a4d00;
    --accent-soft: #fdf1df;
    --on-accent: #1a1208;
    --bad: #b93a2a;
    --bad-soft: #fbe8e5;
    --good: #2b7f52;
    --good-soft: #e4f3ea;
    --focus: #2563eb;
    --shadow: 0 1px 2px rgba(20, 30, 45, 0.06), 0 8px 24px rgba(20, 30, 45, 0.08);
    --font-jp: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    --font-ui: "IBM Plex Sans", "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10141a;
      --surface: #181e26;
      --surface-2: #212933;
      --line: #2d3743;
      --ink: #e6eaf0;
      --ink-2: #b1bac6;
      --ink-3: #7d8794;
      --accent: #f0a23a;
      --accent-ink: #f5b862;
      --accent-soft: #33261a;
      --on-accent: #1a1208;
      --bad: #e4705f;
      --bad-soft: #3a1e1a;
      --good: #5cbf85;
      --good-soft: #17301f;
      --focus: #7aa2f7;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10141a;
    --surface: #181e26;
    --surface-2: #212933;
    --line: #2d3743;
    --ink: #e6eaf0;
    --ink-2: #b1bac6;
    --ink-3: #7d8794;
    --accent: #f0a23a;
    --accent-ink: #f5b862;
    --accent-soft: #33261a;
    --on-accent: #1a1208;
    --bad: #e4705f;
    --bad-soft: #3a1e1a;
    --good: #5cbf85;
    --good-soft: #17301f;
    --focus: #7aa2f7;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    padding-inline: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  b { font-weight: 600; }

  .app { max-width: 800px; margin: 0 auto; padding-block: 24px 48px; }

  /* ---------- 共通部品 ---------- */
  .eyebrow, .count, .ct, .meta, .tag, .pill, kbd {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .eyebrow { font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
  .meta { font-size: 12px; color: var(--ink-3); }
  kbd {
    font-size: 11px;
    color: var(--ink-3);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    line-height: 1.5;
    background: var(--surface);
  }
  .pill {
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--bad-soft);
    color: var(--bad);
    white-space: nowrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:disabled:hover { background: var(--surface); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.primary kbd { color: var(--on-accent); border-color: rgba(0, 0, 0, 0.25); background: transparent; }
  .btn.bad { color: var(--bad); }
  .btn.bad:hover { background: var(--bad-soft); }
  .btn.good { color: var(--good); }
  .btn.good:hover { background: var(--good-soft); }
  .btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .link {
    background: none;
    border: 0;
    padding: 4px 6px;
    border-radius: 6px;
    color: var(--ink-3);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    white-space: nowrap;
  }
  .link:hover { color: var(--ink); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .foot { margin-top: 20px; color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .lead { color: var(--ink-2); margin: 0 0 18px; }

  /* ---------- 一覧画面 ---------- */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-family: var(--font-jp); font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  .quick { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 28px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: var(--ink-2); font-size: 14px; cursor: pointer; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .day { margin-bottom: 26px; }
  .day-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .tag { font-size: 12px; font-weight: 500; color: var(--accent-ink); white-space: nowrap; }
  .day-head .title { flex: 1; min-width: 0; color: var(--ink-2); font-size: 13px; }
  .deck {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: 8px;
    padding: 10px 8px;
    cursor: pointer;
  }
  .deck:hover { background: var(--surface); }
  .deck .nm { flex: 1; min-width: 0; }
  .ct { font-size: 13px; color: var(--ink-3); }

  /* ---------- カード画面 ---------- */
  .bar { display: flex; align-items: center; gap: 12px; }
  .bar .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 13px; color: var(--ink-3); }
  .track { height: 4px; border-radius: 2px; background: var(--surface-2); margin-block: 12px 18px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.2s ease; }
  .card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 300px;
    padding: 26px 28px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .q {
    font-family: var(--font-jp);
    font-size: clamp(24px, 3.6vw, 32px);
    font-weight: 700;
    line-height: 1.4;
    text-wrap: balance;
    /* 文節の境目（ゼロ幅スペース）でだけ折り返し、単語の途中では改行しない。収まらない文節だけ例外的に途中で折る */
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .hint { margin-top: auto; padding-top: 12px; color: var(--ink-3); font-size: 13px; }
  .answer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 18px;
    border-top: 1px dashed var(--line);
    animation: reveal 0.18s ease-out;
  }
  @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .answer { animation: none; }
    .track > i { transition: none; }
  }
  .a-main { font-size: clamp(20px, 3vw, 26px); font-weight: 700; line-height: 1.4; color: var(--accent-ink); text-wrap: balance; }
  .a-rest { color: var(--ink-2); }
  .divider { border: 0; height: 2px; width: 100%; margin: 8px 0 4px; background: var(--surface-2); }
  .n { color: var(--ink-2); }

  /* ---------- 終了画面 ---------- */
  .done {
    padding: 26px 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .score { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 6px 0 14px; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
  .score .bad-t { color: var(--bad); }
  .score .good-t { color: var(--good); }
  .score .muted { color: var(--ink-3); font-size: 15px; align-self: center; }
  .miss-list { list-style: none; margin: 0; padding: 0; }
  .miss-list li { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 9px 0; border-top: 1px solid var(--line); }
  .miss-list .mq { font-family: var(--font-jp); font-weight: 500; }
  .miss-list .ma { color: var(--accent-ink); font-weight: 600; }

  @media (max-width: 480px) {
    .card { padding: 20px 18px 18px; min-height: 260px; }
    .done { padding: 20px 18px; }
    .controls .btn { flex: 1 1 auto; justify-content: center; }
    .bar .btn kbd, .foot kbd { display: none; }
  }

  /* ---------- iPhone 向け調整 ---------- */
  :root {
    --font-jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, sans-serif;
    --font-ui: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    --font-mono: ui-monospace, Menlo, monospace;
  }
  body { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  .btn, .deck, .link, .card, .toggle { touch-action: manipulation; }
  .card { -webkit-user-select: none; user-select: none; }
  .btn kbd { display: none; }
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 1;
    margin: 0 -16px;
    padding: 8px 16px;
    background: var(--bg);
  }
  .controls {
    position: sticky;
    bottom: 0;
    z-index: 1;
    margin: 16px -16px 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
  }
  .done .controls { position: static; margin: 16px 0 0; padding: 0; }
  @media (hover: none) {
    .btn:hover, .btn.bad:hover, .btn.good:hover { background: var(--surface); }
    .btn.primary:hover { background: var(--accent); filter: none; }
    .deck:hover { background: none; }
  }
</style>

<link rel="manifest" href="manifest.webmanifest">

<style>
  /* ホーム画面アプリ版: キーワードは約 1.3 倍（iPhone 幅 390px で 32px、長い文字列は 26px）、
     正解のサービス名は約 2 倍（40px、長い文字列は 32px）。文章型の正解（決まり文句・罠・誤答パターン）は元のまま。
     キーワードは文節の境目（ゼロ幅スペース）でだけ折り返し、単語の途中では改行しない */
  .q { font-size: clamp(28px, 8.2vw, 34px); line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
  .q.q-long { font-size: clamp(24px, 6.7vw, 28px); }
  .a-main.a-name { font-size: clamp(36px, 10.3vw, 44px); line-height: 1.3; overflow-wrap: break-word; }
  .a-main.a-name.a-long { font-size: clamp(30px, 8.2vw, 36px); }
</style>

ーン（4 / 9 行）","cols":{"q":"問題文に出てくるキーワード","a":"正解となるサービス・機能","n":"消去すべき誤答と根拠"},"cards":[{"q":"世界中のユーザーに低レイテンシで配信","a":"**CloudFront**（ACM 証明書は us-east-1）","n":"ELB はリージョン内、Global Accelerator はキャッシュしない。"},{"q":"2 つの静的 IP アドレス","a":"**Global Accelerator**","n":"CloudFront は HTTP/HTTPS のキャッシュ用。「キャッシュ不要」「固定 IP」が出たら Global Accelerator。"},{"q":"有料会員のみ","a":"**Signed URL（個別ファイル）/ Signed Cookies（複数ファイル）**","n":"S3 Presigned URL は CloudFront を経由しない。"},{"q":"エッジで軽量なヘッダー操作","a":"**CloudFront Functions**","n":"複雑な処理（オリジンリクエストの変更、認証、外部 API 呼び出し）→**Lambda@Edge**。"}]},{"id":"Day5-24","day":"Day5","date":"9/26（土）","dayTitle":"NoSQL・キャッシュ ＋ EFS/FSx ＋ ストリーミング ＋ 分析・ML","name":"4 章 NoSQL・特化型 DB","source":"4 章 NoSQL・特化型データベースの鉄板パターン（6 / 22 行）","cols":{"q":"問題文に出てくるキーワード","a":"正解となるサービス・機能","n":"消去すべき誤答と根拠"},"cards":[{"q":"1 桁ミリ秒のレイテンシ","a":"**DynamoDB**","n":"JOIN や複雑なクエリ、トランザクション中心なら RDS。"},{"q":"読み取りをマイクロ秒に","a":"**DynamoDB Accelerator（DAX）**","n":"ElastiCache は DynamoDB 専用ではなくコード変更が大きい。書き込み高速化には効かない。"},{"q":"複数リージョンでアクティブ-アクティブ","a":"**DynamoDB Global Tables**","n":"Aurora Global は書き込みが 1 リージョン。"},{"q":"変更をきっかけに Lambda を起動","a":"**DynamoDB Streams（＋ Lambda トリガー）**","n":"ポーリングは不可。"},{"q":"トラフィックが予測不能","a":"**DynamoDB On-Demand キャパシティ**","n":"予測可能でコスト重視→**Provisioned ＋ Auto Scaling**。特定キーに集中（ホットパーティション）→パーティションキー設計の見直し。"},{"q":"データウェアハウス","a":"**Redshift**","n":"OLTP には不向き。"}]},{"id":"Day5-25","day":"Day5","date":"9/26（土）","dayTitle":"NoSQL・キャッシュ ＋ EFS/FSx ＋ ストリーミング ＋ 分析・ML","name":"4 章 ElastiCache","source":"4 章 インメモリキャッシング（ElastiCache）の鉄板パターン（3 / 3 行）","cols":{"q":"問題文に出てくるキーワード","a":"正解となるサービス・機能","n":"消去すべき誤答と根拠"},"cards":[{"q":"DB の読み取り負荷を軽減","a":"**ElastiCache**","n":"Sticky Session（セッション維持）はスケールしないので不正解。DynamoDB もセッションストアの正解になり得る。"},{"q":"Multi-AZ 自動フェイルオーバー","a":"**ElastiCache for Redis OSS / Valkey**","n":"Memcached はレプリケーション・永続性なし。高可用性が要件なら Redis 一択。"},{"q":"マルチスレッド","a":"**ElastiCache for Memcached**","n":"高可用性が問われたら不可。"}]},{"id":"Day5-26","day":"Day5","date":"9/26（土）","dayTitle":"NoSQL・キャッシュ ＋ EFS/FSx ＋ ストリーミング ＋ 分析・ML","name":"3 章 ファイルシステム","source":"3 章 ファイルシステム（EFS vs FSx ファミリ）の厳格な使い分け（5 / 7 行）","cols":{"q":"問題文に出てくるキーワード","a":"正解となるサービス","n":"消去すべき誤答と根拠"},"cards":[{"q":"NFS","a":"**EFS**","n":"「Windows」「SMB」が出た瞬間に不可。EBS は単一インスタンス。"},{"q":"Windows","a":"**FSx for Windows File Server**（Multi-AZ で HA）","n":"EFS は NFS のみ。"},{"q":"HPC","a":"**FSx for Lustre**（Scratch：一時 / Persistent：長期）","n":"EFS ではスループット不足。"},{"q":"EFS のコストを削減","a":"**EFS Lifecycle Management（EFS IA / Archive）**","n":"手動移動は不可。開発環境で 1 AZ でよい→**EFS One Zone**。"},{"q":"NFS と SMB の両方でアクセス","a":"**FSx for NetApp ONTAP**","n":"Linux と Windows の両方から同一データにアクセスする要件でも正解。"}]},{"id":"Day5-27","day":"Day5","date":"9/26（土）","dayTitle":"NoSQL・キャッシュ ＋ EFS/FSx ＋ ストリーミング ＋ 分析・ML","name":"6 章 ワークフロー・ストリーミング・API","source":"6 章 ワークフロー・ストリーミング・API の鉄板パターン（3 / 7 行）","cols":{"q":"問題文に出てくるキーワード","a":"正解となるサービス・機能","n":"消去すべき誤答と根拠"},"cards":[{"q":"リアルタイム（サブ秒）","a":"**Kinesis Data Streams**","n":"Firehose は保持・再処理ができない。保持は 24 時間〜365 日。"},{"q":"ストリーミングデータを S3 に配信","a":"**Data Firehose**","n":"サブ秒・カスタムコンシューマー・保持が要件なら Data Streams。Firehose はデータを保存しない。"},{"q":"REST API","a":"**API Gateway**","n":"統合タイムアウト 29 秒、ペイロード 10 MB。チャットなど双方向→**WebSocket API**。VPC 内のプライベート API を公開→**VPC Link（NLB）**。"}]},{"id":"Day5-28","day":"Day5","date":"9/26（土）","dayTitle":"NoSQL・キャッシュ ＋ EFS/FSx ＋ ストリーミング ＋ 分析・ML","name":"8 章 分析基盤","source":"8 章 分析基盤の鉄板パターン（4 / 10 行）","cols":{"q":"問題文に出てくるキーワード","a":"正解となるサービス・機能","n":"消去すべき誤答と根拠"},"cards":[{"q":"S3 上のデータに標準 SQL で直接クエリ","a":"**Athena**","n":"Redshift へのロードや EMR クラスター起動は過剰。"},{"q":"サーバーレス ETL","a":"**Glue（＋ Glue Data Catalog）**","n":"「S3 ＋ Glue Data Catalog ＋ Athena」がデータレイクの標準構成。コード不要の視覚的変換→**Glue DataBrew / Glue Studio**。"},{"q":"BI ダッシュボード","a":"**QuickSight**","n":"自前の BI サーバーは運用負荷。"},{"q":"全文検索","a":"**OpenSearch Service**","n":"Athena はインタラクティブ検索に不向き。"}]},{"id":"Day5-29","day":"Day5","date":"9/26（土）","dayTitle":"NoSQL・キャッシュ ＋ EFS/FSx ＋ ストリーミング ＋ 分析・ML","name":"8 章 ML 識別表","source":"8 章 機械学習・AI サービスの識別パターン（4 / 14 行）","cols":{"q":"問題文に出てくるキーワード","a":"正解となるサービス","n":""},"cards":[{"q":"音声をテキストに変換（文字起こし）","a":"**Transcribe**","n":""},{"q":"テキストから感情やキーフレーズを抽出","a":"**Comprehend（Comprehend Medical）**","n":""},{"q":"カスタム ML モデルの構築とデプロイ","a":"**SageMaker**","n":""},{"q":"生成 AI アプリケーションの構築","a":"**Bedrock**","n":""}]},{"id":"Day6-30","day":"Day6","date":"9/27（日、試験前日）","dayTitle":"新規ゼロ、総復習と当日準備","name":"11 章 誤答パターン","source":"","cols":{"q":"問題文の要件","a":"正解の方向","n":"誤答となる選択肢"},"cards":[{"q":"運用オーバーヘッド最小","a":"マネージド / サーバーレス","n":"EC2 上の自前構築（NAT インスタンス、SFTP サーバー、Kafka、cron、自己管理 DB）"},{"q":"高可用性（AZ 障害）","a":"Multi-AZ","n":"Read Replica 単独 / 単一 AZ の ASG"},{"q":"読み取り性能の向上","a":"Read Replica / ElastiCache / DAX","n":"RDS Multi-AZ"},{"q":"アプリからのアクセス","a":"IAM ロール","n":"アクセスキーの埋め込み / IAM ユーザー"},{"q":"インターネットを経由しない","a":"VPC エンドポイント / PrivateLink / Direct Connect","n":"NAT Gateway / Internet Gateway"},{"q":"複数 AZ から共有マウント","a":"EFS / FSx","n":"EBS"}]}]</script>
<script>
  (() => {
    'use strict';

    const DECKS = JSON.parse(document.getElementById('cards-data').textContent);
    const KEY_MISSED = 'saa-tangocho-missed-v1';
    const KEY_SHUFFLE = 'saa-tangocho-shuffle-v1';
    const app = document.getElementById('app');

    // ---------- 永続化（保存できない環境でも動作は止めない）
    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (error) {
        return fallback;
      }
    }
    function save(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // 保存不可（プライベートモード等）なら黙って続ける
      }
    }

    // ---------- データ整形
    const cardKey = (deckName, card) => `${deckName}|${card.q}`;
    const flatCards = (deck) => deck.cards.map((c) => ({
      ...c, deckName: deck.name, source: deck.source, cols: deck.cols, key: cardKey(deck.name, c),
    }));
    const ALL_CARDS = DECKS.flatMap(flatCards);
    const DAYS = [...new Set(DECKS.map((d) => d.day))].map((day) => {
      const decks = DECKS.filter((d) => d.day === day);
      return { day, date: decks[0].date, title: decks[0].dayTitle, decks };
    });

    // Fisher–Yates（元の配列は変更せず、コピーを並べ替える）
    function shuffled(list) {
      const out = [...list];
      for (let i = out.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    // ---------- 状態
    let state = {
      screen: 'list',
      title: '',
      cards: [],
      pos: 0,
      flipped: false,
      judged: {},
      shuffle: load(KEY_SHUFFLE, false) === true,
      missed: new Set(load(KEY_MISSED, [])),
    };
    function setState(patch) {
      state = { ...state, ...patch };
      render();
    }

    // ---------- 表示用ユーティリティ
    const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ESC[ch]);
    const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
    const missedIn = (cards) => cards.filter((c) => state.missed.has(c.key)).length;

    // 全角 1・半角 0.55 として見た目の幅を概算し、長い文字列に一段小さく表示するためのクラスを付ける
    const visualWidth = (s) => [...s].reduce((w, ch) => w + (ch.charCodeAt(0) > 0x2e7f ? 1 : 0.55), 0);
    const longClass = (s, limit, cls) => (visualWidth(s) > limit ? ` ${cls}` : '');

    // 正解セルを「サービス名」と「補足」に分ける。太字があればその部分がサービス名。
    // 太字がなくても全角 30 文字以内なら名前として扱い（罠・誤答パターンの表）、それより長ければ文章型の正解（決まり文句の表）
    const NAME_MAX_WIDTH = 30;
    function splitAnswer(a) {
      const bold = [...a.matchAll(/\*\*(.+?)\*\*/g)].map((m) => m[1]);
      if (bold.length === 0) return { main: a, rest: '', isName: visualWidth(a) <= NAME_MAX_WIDTH };
      return { main: bold.join(' ／ '), rest: a.replace(/\*\*(.+?)\*\*/g, '').trim(), isName: true };
    }

    // 日本語のキーワードが単語の途中で折り返されないよう、文節らしい境目にだけゼロ幅スペースを入れる。
    // 境目: ひらがなの後に漢字・カタカナ・英数が来る所、漢字とカタカナの切り替わり、句読点や括弧の前後
    const isHira = (ch) => /[ぁ-ゟ]/.test(ch);
    const isKata = (ch) => /[゠-ヿ]/.test(ch);
    const isKanji = (ch) => /[一-鿿]/.test(ch);
    const isLatin = (ch) => /[A-Za-z0-9０-９]/.test(ch);
    function isPhraseBoundary(ch, next) {
      if (isHira(ch) && (isKanji(next) || isKata(next) || isLatin(next))) return true;
      if ((isKata(ch) && isKanji(next)) || (isKanji(ch) && isKata(next))) return true;
      return /[、。・）」]/.test(ch) || /[（「]/.test(next);
    }
    // 8 文字以上続くカタカナ語の直後の助詞（ひらがな）の前も境目にし、長い外来語が 1 行に収まらない事態を減らす
    const LONG_KATA_RUN = 8;
    function phraseBreaks(s) {
      const chars = [...s];
      let kataRun = 0;
      return chars.map((ch, i) => {
        kataRun = isKata(ch) ? kataRun + 1 : 0;
        const next = chars[i + 1];
        const cut = next !== undefined && (isPhraseBoundary(ch, next) || (kataRun >= LONG_KATA_RUN && isHira(next)));
        return cut ? `${ch}​` : ch;
      }).join('');
    }
    // 折り返し位置で区切った文節のうち最長のものの幅（全角換算）。1 行に収まらない文節があれば一段小さく表示する
    const maxSegmentWidth = (s) => Math.max(...phraseBreaks(s).split(/[​ ]/).map(visualWidth));
    const qSizeClass = (q) => (visualWidth(q) > 24 || maxSegmentWidth(q) > 9 ? ' q-long' : '');

    // ---------- 一覧画面
    function renderList() {
      const missedTotal = missedIn(ALL_CARDS);
      const missedBtn = missedTotal
        ? `<button class="btn bad" data-action="missed">✕ 落とした行だけ <span class="ct">${missedTotal}</span></button>`
        : '';
      const clearBtn = missedTotal
        ? `<p class="foot"><button class="link" data-action="clear-missed">落とした印をすべて消す</button></p>`
        : '';
      return `
        <header class="head">
          <h1>SAA 鉄板パターン単語帳</h1>
          <span class="meta">${DECKS.length} 表 · ${ALL_CARDS.length} 枚 · 9/22 19:56 版</span>
        </header>
        <p class="lead">表を選ぶとキーワードが出る。タップで正解と根拠を表示。左スワイプで次へ、右スワイプで前へ。</p>
        <div class="quick">
          <button class="btn" data-action="all">全表を通しで <span class="ct">${ALL_CARDS.length}</span></button>
          ${missedBtn}
          <label class="toggle" for="shuffle"><input type="checkbox" id="shuffle" ${state.shuffle ? 'checked' : ''}>シャッフル</label>
        </div>
        ${DAYS.map(renderDay).join('')}
        ${clearBtn}`;
    }
    function renderDay(day) {
      const n = day.decks.reduce((sum, d) => sum + d.cards.length, 0);
      return `
        <section class="day">
          <div class="day-head">
            <span class="tag">${esc(day.day)} · ${esc(day.date)}</span>
            <span class="title">${esc(day.title)}</span>
            <button class="link" data-action="day" data-day="${esc(day.day)}">この日の全表 ${n}</button>
          </div>
          ${day.decks.map(renderDeckRow).join('')}
        </section>`;
    }
    function renderDeckRow(deck) {
      const m = missedIn(flatCards(deck));
      return `
        <button class="deck" data-action="deck" data-id="${esc(deck.id)}">
          <span class="nm">${esc(deck.name)}</span>
          ${m ? `<span class="pill">✕ ${m}</span>` : ''}
          <span class="ct">${deck.cards.length} 枚</span>
        </button>`;
    }

    // ---------- カード画面
    function renderCard() {
      const card = state.cards[state.pos];
      const total = state.cards.length;
      const pct = (state.pos / total) * 100;
      const deckTag = card.deckName !== state.title ? `<span>· ${esc(card.deckName)}</span>` : '';
      const wasMissed = state.missed.has(card.key) ? '<span class="pill">✕ 前回落とした</span>' : '';
      const body = state.flipped
        ? renderAnswer(card)
        : '<div class="hint">タップで答えを表示</div>';
      return `
        <div class="bar">
          <button class="btn small" data-action="list">← 一覧 <kbd>Esc</kbd></button>
          <span class="name">${esc(state.title)}</span>
          <span class="count">${state.pos + 1} / ${total}</span>
        </div>
        <div class="track"><i style="width:${pct}%"></i></div>
        <div class="card" role="button" tabindex="0" data-action="advance" aria-live="polite">
          <div class="eyebrow"><span>${esc(card.cols.q)}</span>${deckTag}${wasMissed}</div>
          <div class="q${qSizeClass(card.q)}">${esc(phraseBreaks(card.q))}</div>
          ${body}
        </div>
        <div class="controls">${renderControls()}</div>
        <p class="foot">
          <span>元の表: ${esc(card.source || card.deckName)}</span>
          <span>左スワイプ 次へ · 右スワイプ 前へ</span>
        </p>`;
    }
    function renderAnswer(card) {
      const { main, rest, isName } = splitAnswer(card.a);
      const label = card.cols.n ? `<div class="eyebrow">${esc(card.cols.n)}</div>` : '';
      const note = card.n ? `<hr class="divider">${label}<div class="n">${fmt(card.n)}</div>` : '';
      const mainClass = isName ? `a-name${longClass(main, 22, 'a-long')}` : 'a-text';
      return `
        <div class="answer">
          <div class="eyebrow">${esc(card.cols.a)}</div>
          <div class="a-main ${mainClass}">${fmt(main)}</div>
          ${rest ? `<div class="a-rest">${fmt(rest)}</div>` : ''}
          ${note}
        </div>`;
    }
    function renderControls() {
      const prev = `<button class="btn" data-action="back" ${state.pos === 0 ? 'disabled' : ''}>← 前へ</button>`;
      if (!state.flipped) {
        return `${prev}<button class="btn primary" data-action="advance">答えを見る →</button>`;
      }
      return `${prev}
        <button class="btn bad" data-action="miss">✕ 落とした <kbd>x</kbd></button>
        <button class="btn good" data-action="ok">○ 即答できた <kbd>o</kbd></button>
        <button class="btn primary" data-action="advance">次へ →</button>`;
    }

    // ---------- 終了画面
    function renderDone() {
      const miss = state.cards.filter((c) => state.judged[c.key] === 'miss');
      const ok = Object.values(state.judged).filter((j) => j === 'ok').length;
      const unjudged = state.cards.length - miss.length - ok;
      const list = miss.length
        ? `<ul class="miss-list">${miss.map((c) => `
            <li><span class="mq">${esc(c.q)}</span><span class="ma">${fmt(splitAnswer(c.a).main)}</span></li>`).join('')}</ul>`
        : '<p class="lead">落とした行はなし。</p>';
      const retryMissed = miss.length
        ? '<button class="btn primary" data-action="retry-missed">落とした行だけもう一度</button>'
        : '';
      return `
        <div class="bar">
          <button class="btn small" data-action="list">← 一覧 <kbd>Esc</kbd></button>
          <span class="name">${esc(state.title)}</span>
          <span class="count">${state.cards.length} / ${state.cards.length}</span>
        </div>
        <div class="track"><i style="width:100%"></i></div>
        <div class="done">
          <div class="eyebrow">終了 · ${state.cards.length} 枚</div>
          <div class="score">
            <span class="bad-t">✕ ${miss.length}</span>
            <span class="good-t">○ ${ok}</span>
            ${unjudged ? `<span class="muted">未判定 ${unjudged}</span>` : ''}
          </div>
          ${list}
          <div class="controls">
            ${retryMissed}
            <button class="btn" data-action="retry">最初から</button>
            <button class="btn" data-action="list">表の一覧へ</button>
          </div>
        </div>`;
    }

    function render() {
      const views = { list: renderList, card: renderCard, done: renderDone };
      app.innerHTML = views[state.screen]();
      if (state.screen === 'card') {
        const card = app.querySelector('.card');
        if (card) card.focus({ preventScroll: true });
      }
    }

    // ---------- 操作
    function start(title, cards) {
      if (cards.length === 0) return;
      const ordered = state.shuffle ? shuffled(cards) : cards;
      setState({ screen: 'card', title, cards: ordered, pos: 0, flipped: false, judged: {} });
    }
    function goList() {
      setState({ screen: 'list' });
    }
    function next() {
      if (state.pos + 1 >= state.cards.length) setState({ screen: 'done' });
      else setState({ pos: state.pos + 1, flipped: false });
    }
    function back() {
      if (state.pos > 0) setState({ pos: state.pos - 1, flipped: false });
    }
    function advance() {
      if (state.flipped) next();
      else setState({ flipped: true });
    }
    // ✕ は印を付けて次へ、○ は印を消して次へ
    function judge(isMiss) {
      if (!state.flipped) return;
      const card = state.cards[state.pos];
      const missed = new Set(state.missed);
      if (isMiss) missed.add(card.key);
      else missed.delete(card.key);
      save(KEY_MISSED, [...missed]);
      state = { ...state, missed, judged: { ...state.judged, [card.key]: isMiss ? 'miss' : 'ok' } };
      next();
    }
    function clearMissed() {
      if (!window.confirm('落とした印をすべて消しますか？')) return;
      save(KEY_MISSED, []);
      setState({ missed: new Set() });
    }

    const ACTIONS = {
      deck: (el) => {
        const deck = DECKS.find((d) => d.id === el.dataset.id);
        if (deck) start(deck.name, flatCards(deck));
      },
      day: (el) => {
        const day = DAYS.find((d) => d.day === el.dataset.day);
        if (day) start(`${day.day} の全表`, day.decks.flatMap(flatCards));
      },
      all: () => start('全表を通しで', ALL_CARDS),
      missed: () => start('落とした行だけ', ALL_CARDS.filter((c) => state.missed.has(c.key))),
      'clear-missed': clearMissed,
      list: goList,
      advance,
      back,
      miss: () => judge(true),
      ok: () => judge(false),
      retry: () => start(state.title, state.cards),
      'retry-missed': () => start(`${state.title}（落とした行）`, state.cards.filter((c) => state.missed.has(c.key))),
    };

    app.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      const fn = ACTIONS[el.dataset.action];
      if (fn) fn(el);
    });
    app.addEventListener('change', (e) => {
      if (e.target.id !== 'shuffle') return;
      save(KEY_SHUFFLE, e.target.checked);
      setState({ shuffle: e.target.checked });
    });

    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (state.screen !== 'card') {
        if (e.key === 'Escape' && state.screen === 'done') goList();
        return;
      }
      // ボタンにフォーカスがある時の Space / Enter はボタン自身のクリックに任せる
      const onControl = e.target.closest && e.target.closest('button, input, a');
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      const handlers = {
        ArrowRight: advance,
        ArrowLeft: back,
        Escape: goList,
        x: () => judge(true),
        o: () => judge(false),
        ' ': onControl ? null : advance,
        Enter: onControl ? null : advance,
      };
      const fn = handlers[key];
      if (!fn) return;
      e.preventDefault();
      fn();
    });

    render();
  })();
</script>
<script>
  (() => {
    'use strict';
    // 左右スワイプを ← / → キー操作に変換する（タップは従来どおりクリック扱い）
    const THRESHOLD = 50;
    const MAX_MS = 600;
    let start = null;
    document.addEventListener('touchstart', (e) => {
      const onControl = e.target.closest && e.target.closest('button, input, a');
      if (e.touches.length !== 1 || onControl || !document.querySelector('.card')) {
        start = null;
        return;
      }
      start = { x: e.touches[0].clientX, y: e.touches[0].clientY, at: Date.now() };
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (!start) return;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - start.x;
      const dy = touch.clientY - start.y;
      const elapsed = Date.now() - start.at;
      start = null;
      if (elapsed > MAX_MS || Math.abs(dx) < THRESHOLD || Math.abs(dx) < Math.abs(dy) * 2) return;
      document.dispatchEvent(new KeyboardEvent('keydown', { key: dx < 0 ? 'ArrowRight' : 'ArrowLeft' }));
    }, { passive: true });
  })();
</script>
<script>
  // https（または localhost）で開いたときだけ Service Worker を登録し、2 回目以降はオフラインでも動くようにする
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // 登録できなくてもオンラインなら通常どおり動く
    });
  }
</script>
